<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" href="https://static.igem.wiki/teams/6379/wiki/logo/logo-only.avif"/>
    <link rel="license" href="https://creativecommons.org/licenses/by/4.0/"/>

    <!-- Every page pulls its banner, photos and fonts from static.igem.wiki.
         Opening that connection while the HTML is still being parsed gets the
         DNS lookup and the TLS handshake out of the way before the first image
         is even asked for. -->
    <link rel="preconnect" href="https://static.igem.wiki" crossorigin>

    <!-- Bootstrap CSS -->
    <link href="{{ url_for('static', filename = 'bootstrap.min.css') }}" rel="stylesheet">

    <!-- Custom CSS -->
    <link href="{{ url_for('static', filename = 'style.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename = 'page-toc.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename = 'site-loader.css') }}" rel="stylesheet">
    <!-- The loading screen's bacterium is asked for first, so it is there when
         the screen is. Without JavaScript the screen is not drawn at all. -->
    <link rel="preload" as="image" href="https://static.igem.wiki/teams/6379/wiki/onlinegame/bacteria.avif" fetchpriority="high">
    <noscript><style>.site-loader { display: none !important; }</style></noscript>

    <title>{% block title %}{% endblock %} | NCKU-Tainan - iGEM 2026</title>

</head>
<body class="{% block body_class %}{% endblock %}">
  <!-- Loading screen: a large P. aeruginosa with a ring of AHL under it, the
       large disc stepping clockwise. Shown until the page has fully loaded;
       see static/site-loader.css. -->
  <div class="site-loader" id="siteLoader" role="status" aria-busy="true">
    <div class="site-loader-stage">
      <img class="site-loader-germ" src="https://static.igem.wiki/teams/6379/wiki/onlinegame/bacteria.avif" alt="" width="218" height="295" decoding="async" fetchpriority="high">
      <div class="site-loader-ring" aria-hidden="true">
        <span class="site-loader-slot" style="--i:0"><span class="cap-ahl"></span></span>
        <span class="site-loader-slot" style="--i:1"><span class="cap-ahl"></span></span>
        <span class="site-loader-slot" style="--i:2"><span class="cap-ahl"></span></span>
        <span class="site-loader-slot" style="--i:3"><span class="cap-ahl"></span></span>
        <span class="site-loader-slot" style="--i:4"><span class="cap-ahl"></span></span>
        <span class="site-loader-slot" style="--i:5"><span class="cap-ahl"></span></span>
        <span class="site-loader-slot" style="--i:6"><span class="cap-ahl"></span></span>
        <span class="site-loader-slot" style="--i:7"><span class="cap-ahl"></span></span>
      </div>
      <span class="visually-hidden">Loading the page</span>
    </div>
  </div>
  <script src="{{ url_for('static', filename = 'site-loader.js') }}"></script>

  <!-- Navigation -->
  {% include 'menu.html' %}

  <!-- Header -->
  {% block header %}
  <header class="bg-hero page-hero py-5 mb-5">
    <div class="page-hero-bg" style="background-image: url('{% block hero_image %}https://static.igem.wiki/teams/6379/wiki/banner/education.avif{% endblock %}');"></div>
    <div class="page-hero-tint"></div>
    <div class="container h-100">
      <div class="row h-100 align-items-center">
        <div class="col-lg-12">
          <h1 class="display-4 hero-title mt-5 mb-2">{% block hero_title %}{{ self.title() }}{% endblock %}</h1>
	        <p class="lead mb-5 hero-sub">{% block lead %}{% endblock %}</p>
        </div>
      </div>
    </div>
  </header>
  {% endblock %}

  <!-- Page Content -->
  <div class="container">
    {% block page_content %}{% endblock %}
  </div>

  <!-- Footer: MUST mention license AND have a link to team wiki's repository on gitlab.igem.org -->
  {% include 'footer.html' %}

  <!-- Back to top: sits outside the footer so position:fixed is not affected
       by any transformed ancestor. Hidden until the page is scrolled. -->
  <button type="button" id="backToTop" class="back-to-top" aria-label="Back to top" title="Back to top">
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 16 16" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M8 13V3.5"/><path d="M3.5 8 8 3.5 12.5 8"/>
    </svg>
  </button>

  <!-- Bootstrap Bundle with Popper -->
  <script src="{{ url_for('static', filename = 'bootstrap.bundle.min.js') }}"></script>
  <script src="{{ url_for('static', filename = 'navbar-scroll.js') }}"></script>
  <script src="{{ url_for('static', filename = 'page-toc.js') }}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
