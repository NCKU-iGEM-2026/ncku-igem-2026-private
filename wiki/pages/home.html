{% extends "layout.html" %}

{% block title %}Home{% endblock %}

{% block page_content %}

<div class="jumbotron jumbotron-fluid text-center text-white d-flex align-items-center justify-content-center" style="background: linear-gradient(135deg, #2c3e50 0%, #1f6f78 55%, #1abc9c 100%); height: 450px; margin-top: -24px;">
  <div>
    <h1 class="display-3 font-weight-bold">Welcome</h1>
    <p class="lead">Slogan</p>
  </div>
</div>

<div class="container my-5">
  
  <!-- Abstract 區塊 -->
  <div class="row justify-content-center">
    <div class="col-lg-9 shadow p-5 bg-white rounded">
      <h2 class="text-center mb-4 font-weight-bold" style="color: #2c3e50; border-bottom: 3px solid #1abc9c; padding-bottom: 10px;">
        Abstract
      </h2>
      <p class="lead text-secondary" style="line-height: 1.8; text-align: justify;">
        摘要內容...
      </p>
    </div>
  </div>

  <div class="row mt-5">
    <div class="col-md-6">
      <h3 class="font-weight-bold">Project Background</h3>
      <p>這裡可以簡單寫一兩段為什麼要做這個題目，引導讀者去點擊 Project -> Description 頁面看詳情。</p>
    </div>
    <div class="col-md-6">
      <h3 class="font-weight-bold">Key Achievements</h3>
      <p>這裡可以放一些團隊最引以為傲的亮點。</p>
    </div>
  </div>

</div>

{% endblock %}
